experiment:
  seed: null
  model_random_state: 42
  n_clusters: 3
  check_ari: true # log ari and silhouette

# # 2 clusters
# data:
#   ns: 2000
#   nt: 100
#   n_features: 16
#   dist: 2
#   std_source: [1.0, 1.5]
#   std_target: [1.0, 2.0]
#   shift: 7
#   scaler: StandardScaler
#   data_gen_method: gen_domain_adaptation_data2  # Options: gen_domain_adaptation_data2, gen_domain_adaptation_data_k

# # k clusters
data:
  ns: 2000
  nt: 500
  n_features: 40
  dist: 1.5 # distance between clusters
  std_source: [0.25, 0.5, 1] # ignore
  std_target: [0.25, 0.5, 1] # ignore
  shift: 3 # ignore
  scaler: StandardScaler # ignore
  data_gen_method: gen_domain_adaptation_data_k #ignore

model:
  encoder_hidden_dims: [300,100]
  decoder_hidden_dims: [50, 100, 500] # not used ignore
  critic_hidden_dims: [100]
  alpha1: 0.0001 # critic
  alpha2: 0.00001 # encoder
  use_decoder: false

training:
  num_epochs: 3000
  batch_size: 50 # no need to change
  dc_iter: 6 # epoch train critic adjudst +1 or -1
  gamma: 5.0 # how strong of critic gradient
  delta: 0.5 # delta, lambda controls the decoder - ignore if use_decoder = false ignore
  lambda: 1.0 # ignore
  # early stopping is not complete - set false
  early_stopping: false # ignore
  patience: 40 # ignore
  min_delta: !!float 1e-5 #ignore
  verbose: false #ignore
